<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fixtures — UNCW Women's Soccer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  /* Trends dashboard */
  .trend-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .trend-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px 6px; flex: 1; min-width: 260px; }
  .trend-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.4px; }
  .trend-card canvas { max-height: 160px; }
  .form-strip { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; padding: 8px 0 4px; }
  .form-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .form-logo, .form-logo-placeholder { width: 22px; height: 22px; object-fit: contain; }
  .form-logo-placeholder { border-radius: 50%; background: var(--border); }
  .form-badge { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .form-badge.Win { background: var(--win); color: var(--win-text); }
  .form-badge.Loss { background: var(--loss); color: var(--loss-text); }
  .form-badge.Draw { background: var(--off); color: var(--off-text); }
  .form-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }
  .form-item-upcoming .form-logo, .form-item-upcoming .form-logo-placeholder { opacity: 0.75; }
  .form-loc { font-size: 10px; font-weight: 400; color: var(--navy); letter-spacing: 0.3px; }

  /* Schedule table */
  table.std tr.sched-row-clickable { cursor: pointer; }
  table.std tr.sched-row-clickable:hover td { background: rgba(0, 118, 128, 0.10) !important; }
  table.std tr.sched-row-selected td { background: rgba(243, 227, 137, 0.35) !important; }
  .result-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .result-badge.Win { background: var(--win); color: var(--win-text); }
  .result-badge.Loss { background: var(--loss); color: var(--loss-text); }
  .result-badge.Draw { background: var(--off); color: var(--off-text); }

  /* Match Center (ported from the classic dashboard, uncw_schedule_matrix_v5.html) */
  .mc-header { display: flex; align-items: center; gap: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; flex-wrap: wrap; }
  .mc-header .mc-result { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
  .mc-header .mc-result.Win { background: var(--win); color: var(--win-text); }
  .mc-header .mc-result.Loss { background: var(--loss); color: var(--loss-text); }
  .mc-header .mc-result.Draw { background: var(--off); color: var(--off-text); }
  .mc-header .mc-score { font-size: 22px; font-weight: 700; color: var(--navy); }
  .mc-header .mc-meta { font-size: 12px; color: var(--muted); }
  .mc-header select { font-family: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); margin-left: auto; }
  table.mc-compare { border-collapse: collapse; font-size: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: 100%; }
  table.mc-compare th { background: var(--navy); color: #fff; font-weight: 600; padding: 6px 8px; }
  table.mc-compare th.mc-us, table.mc-compare th.mc-opp { width: 70px; text-align: center; }
  table.mc-compare td { padding: 5px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  table.mc-compare tr:last-child td { border-bottom: none; }
  table.mc-compare td.mc-us, table.mc-compare td.mc-opp { text-align: center; font-weight: 600; width: 70px; }
  /* FotMob-style category-winner pill: a wide ellipse behind the winning
     value, teal+white for a UNCW win, the opponent's own brand color+white
     for an opponent win (color threaded in from build_matrix_data.py's
     TEAM_COLORS via each match's opponentColor field -- see fixtures.html
     JS's renderCompareTable()). Replaces the old plain-teal-text .mc-lead
     treatment (2026-09-13, Colin's ask). */
  table.mc-compare .mc-pill { display: inline-block; min-width: 28px; padding: 2px 11px; border-radius: 999px; font-weight: 700; line-height: 1.5; }
  table.mc-compare td.mc-label { color: var(--muted); }
  table.mc-compare tr:nth-child(even) td { background: rgba(0, 118, 128, 0.05); }
  .mc-chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px 6px; }
  .mc-chart-wrap canvas { max-height: 220px; }
  .mc-chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .mc-chart-legend b { color: var(--text); }
</style>
</head>
<body data-page="fixtures">
<div class="app-layout">
  <nav class="app-sidebar" id="app-sidebar"></nav>
  <main class="app-main">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <h1 class="page-title" style="margin-bottom:0;">Fixtures</h1>
      <label style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        Season
        <select id="fixtures-season-select" style="font-family:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);"></select>
      </label>
    </div>
    <p class="sub" id="fixtures-sub">Loading schedule&hellip;</p>
    <p class="note" id="fixtures-historical-note" style="display:none;"></p>

    <h2 class="section-title">Trends</h2>
    <div class="trend-row">
      <div class="trend-card">
        <h3>Form (last 5)</h3>
        <div class="form-strip" id="trend-form"></div>
      </div>
      <div class="trend-card">
        <h3>Goals scored/conceded</h3>
        <canvas id="trend-goals-chart"></canvas>
      </div>
      <div class="trend-card">
        <h3>Match Flow</h3>
        <canvas id="trend-flow-chart"></canvas>
      </div>
      <div class="trend-card">
        <h3>RPI rank</h3>
        <canvas id="trend-rpi-chart"></canvas>
      </div>
    </div>

    <h2 class="section-title">Schedule</h2>
    <p class="note">Click a played, tagged match to jump to its Match Center detail below.</p>
    <div class="scroll-wrap"><table class="std" id="schedule-table"></table></div>

    <h2 class="section-title">Match Center</h2>
    <p class="note" id="mc-note"></p>
    <div class="mc-header" id="mc-header"></div>
    <div class="tables-row">
      <div style="flex:1;min-width:260px;">
        <div class="table-label">Match Statistics</div>
        <table class="mc-compare" id="mc-stats-table"></table>
      </div>
      <div style="flex:1;min-width:260px;">
        <div class="table-label">Match Objectives</div>
        <table class="mc-compare" id="mc-objectives-table"></table>
      </div>
    </div>
    <div class="tables-row">
      <div class="mc-chart-wrap" style="flex:1;min-width:280px;">
        <div style="font-weight:600;font-size:13px;">Match Flow</div>
        <canvas id="mc-flow-chart"></canvas>
        <div class="mc-chart-legend" id="mc-flow-legend"></div>
      </div>
      <div class="mc-chart-wrap" style="flex:1;min-width:280px;">
        <div style="font-weight:600;font-size:13px;">xG Flow</div>
        <canvas id="mc-xg-chart"></canvas>
        <div class="mc-chart-legend" id="mc-xg-legend"></div>
      </div>
    </div>
  </main>
</div>

// Same isolation practice as every other page since the v3.10 outage:
// the trends dashboard, the schedule table, and Match Center are each
// wrapped in their own try/catch below, so a problem in one can't take
// down the others -- on top of sidebar.js already being a separate
// <script> tag that nothing here can affect.

function fmtDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", {month: "short", day: "numeric"});
}

// Every UNCW opponent's brand color, keyed by the same "opponent" spelling
// MATCH_CENTER uses -- comes straight from build_matrix_data.py's
// TEAM_COLORS via each match's opponentColor field, so there's one source
// of truth (Python) and this is read-only reuse, not a second copy to keep
// in sync.
const UNCW_TEAL = {bg: "#007680", fg: "#FFFFFF"};

// ---- Season picker: 2026-09-13, Colin's ask to build out Fixtures for
// every season we have data for, not just the live one. FIXTURES_SEASONS
// preserves the order build_matrix_data.py/do_rebuild.py wrote the seasons
// in (most recent first); everything below re-renders per selected season
// instead of assuming a single embedded season like the rest of the site. ----
const FIXTURES_SEASONS = Object.keys(MATCH_CENTER_BY_SEASON || {});
let goalsChart = null, rpiChart = null, flowTrendChart = null;
let mcFlowChart = null, mcXgChart = null;
let selectMatch = () => {};

function lineChart(prevChart, canvasId, labels, datasets, opts) {
  if (prevChart) prevChart.destroy();
  opts = opts || {};
  const canvas = document.getElementById(canvasId);
  const fallbackId = canvasId + "-fallback";
  let fallback = document.getElementById(fallbackId);
  if (typeof Chart === "undefined") {
    if (canvas) canvas.hidden = true;
    if (!fallback && canvas) {
      fallback = document.createElement("div");
      fallback.id = fallbackId;
      fallback.style.cssText = "text-align:center;color:var(--muted);font-size:12px;padding:20px 4px;";
      fallback.textContent = "Chart library didn't load -- try refreshing the page.";
      canvas.insertAdjacentElement("afterend", fallback);
    }
    return null;
  }
  const hasData = labels.length && datasets.some(ds => (ds.data || []).some(v => v != null));
  if (!hasData) {
    if (canvas) canvas.hidden = true;
    if (!fallback && canvas) {
      fallback = document.createElement("div");
      fallback.id = fallbackId;
      fallback.style.cssText = "text-align:center;color:var(--muted);font-size:12px;padding:20px 4px;";
      canvas.insertAdjacentElement("afterend", fallback);
    }
    if (fallback) fallback.textContent = labels.length ? "Not tracked for this season." : "No data yet.";
    return null;
  }
  if (canvas) canvas.hidden = false;
  if (fallback) fallback.hidden = true;
  const ctx = canvas.getContext("2d");
  return new Chart(ctx, {
    type: "line",
    data: {labels: labels, datasets: datasets},
    options: Object.assign({
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.8,
      plugins: {legend: {display: datasets.length > 1, labels: {font: {size: 10}}}},
      scales: {
        x: {ticks: {font: {size: 9}}},
        y: {ticks: {font: {size: 9}}, beginAtZero: !opts.reverseY},
      },
    }, opts.chartOptions || {}),
  });
}

// ---- Trends dashboard ----
function renderTrends(season) {
  try {
    const fx = FIXTURES_SUMMARY_BY_SEASON[season] || {};
    const mc = MATCH_CENTER_BY_SEASON[season] || {};
    const T = fx.trends || {};
    document.getElementById("fixtures-sub").textContent = fx.team
      ? `${fx.team} — full ${season || "season"} schedule.`
      : "No schedule data yet.";

    const historicalNote = document.getElementById("fixtures-historical-note");
    if (fx.isCurrentSeason === false) {
      historicalNote.style.display = "";
      historicalNote.textContent = "Historical season — opponent RPI rank, opponent overall record, and UNCW's live-RPI trend aren't available here (only the current live scrape covers those).";
    } else {
      historicalNote.style.display = "none";
      historicalNote.textContent = "";
    }

    const formRow = document.getElementById("trend-form");
    const formItems = [];
    const locHtml = loc => loc ? `<div class="form-loc">${loc}</div>` : "";
    if (T.form && T.form.length) {
      T.form.forEach(r => {
        const logo = r.logo
          ? `<img class="form-logo" src="${r.logo}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'form-logo-placeholder'}))">`
          : `<div class="form-logo-placeholder"></div>`;
        const result = r.result || "?";
        formItems.push(`<div class="form-item" title="${r.opponent || ""} — ${result}">${logo}<div class="form-badge ${result}" title="${result}">${result[0]}</div>${locHtml(r.loc)}</div>`);
      });
    }
    // Divider only makes sense once there's a "most recent match" to put it
    // after AND an upcoming match to show past it (Colin's ask, 2026-09-14:
    // "a line after the most recent match and the two logos of the next 2
    // matches", narrowed the same day to just the next match) -- skip it
    // for an empty-form early season or a fully-completed/historical
    // season with nothing left to play.
    if (formItems.length && T.upcoming && T.upcoming.length) {
      formItems.push(`<div class="form-divider"></div>`);
    }
    if (T.upcoming && T.upcoming.length) {
      T.upcoming.forEach(u => {
        const logo = u.logo
          ? `<img class="form-logo" src="${u.logo}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'form-logo-placeholder'}))">`
          : `<div class="form-logo-placeholder"></div>`;
        formItems.push(`<div class="form-item form-item-upcoming" title="${u.opponent || ""} — ${fmtDate(u.date)}">${logo}${locHtml(u.loc)}</div>`);
      });
    }
    formRow.innerHTML = formItems.length ? formItems.join("") : `<p class="note" style="margin:0;">No results yet.</p>`;

    goalsChart = lineChart(goalsChart, "trend-goals-chart", (T.goals || []).map(g => fmtDate(g.date)), [
      {label: "GF", data: (T.goals || []).map(g => g.gf), borderColor: "#007680", backgroundColor: "#007680", tension: 0.15},
      {label: "GA", data: (T.goals || []).map(g => g.ga), borderColor: "#c0392b", backgroundColor: "#c0392b", tension: 0.15},
    ]);

    rpiChart = lineChart(rpiChart, "trend-rpi-chart", (T.rpi || []).map(r => fmtDate(r.date)), [
      {label: "RPI rank", data: (T.rpi || []).map(r => r.rank), borderColor: "#003366", backgroundColor: "#003366", tension: 0.15, spanGaps: true},
    ], {reverseY: true, chartOptions: {scales: {y: {reverse: true, ticks: {font: {size: 9}}}}}});

    flowTrendChart = lineChart(flowTrendChart, "trend-flow-chart", (T.flow || []).map(f => fmtDate(f.date)), [
      {label: "Match Flow", data: (T.flow || []).map(f => f.value), borderColor: "#007680", backgroundColor: "#007680", tension: 0.15},
    ]);
  } catch (e) {
    console.error("Fixtures trends failed to render:", e);
    document.getElementById("fixtures-sub").textContent = "Couldn't load trends (see browser console).";
  }
}

// ---- Schedule table ----
function renderSchedule(season) {
  try {
    const rows = (FIXTURES_SUMMARY_BY_SEASON[season] || {}).schedule || [];
    const el = document.getElementById("schedule-table");
    if (!rows.length) {
      el.innerHTML = "";
      el.insertAdjacentHTML("afterend", '<p class="note" id="schedule-table-empty">No schedule data yet.</p>');
      return;
    }
    document.getElementById("schedule-table-empty")?.remove();
    el.innerHTML = `<thead><tr>
        <th>Date</th><th>Type</th><th>Opponent</th><th>Venue</th><th>Score</th>
        <th>Result</th><th class="num">Opp RPI</th><th>Opp Record</th>
      </tr></thead><tbody></tbody>`;
    const tbody = el.querySelector("tbody");
    rows.forEach(g => {
      const tr = document.createElement("tr");
      tr.dataset.date = g.date;
      if (g.hasStats) {
        tr.className = "sched-row-clickable";
        tr.title = "Click to view Match Center detail";
        tr.addEventListener("click", () => selectMatch(g.date));
      }
      const resultCell = g.played
        ? `<span class="result-badge ${g.result}">${g.result}</span>`
        : `<span class="note">upcoming</span>`;
      tr.innerHTML = `<td>${fmtDate(g.date)}</td><td>${g.type || ""}</td><td>${g.opponent || ""}</td>
        <td>${g.venue || ""}${g.city ? " &middot; " + g.city : ""}</td>
        <td>${g.fullTimeScore || "—"}</td><td>${resultCell}</td>
        <td class="num">${g.opponentRpiRank != null ? "#" + g.opponentRpiRank : "—"}</td>
        <td>${g.opponentRecord || "—"}</td>`;
      tbody.appendChild(tr);
    });
  } catch (e) {
    console.error("Fixtures schedule table failed to render:", e);
  }
}

function fmtVal(v, key) {
  if (v == null) return "—";
  // Throw-Ins % is always a percentage -- always 1 decimal (e.g. "6.9%"),
  // not the general xG-style 3-decimal rule below, which used to kick in
  // for any sub-10 percentage and print "6.900%" (caught 2026-09-13 while
  // verifying the multi-season Fixtures rollout against Fall 2024 data).
  if (key === "throwInPct" && typeof v === "number") return v.toFixed(1);
  if (typeof v === "number" && !Number.isInteger(v)) return v.toFixed(v < 10 ? 3 : 1);
  return v;
}

// FotMob-style category-winner pill (2026-09-13, Colin's ask): the winning
// side's value gets a wide elliptical background instead of the old plain
// teal text -- teal+white for a UNCW win, the opponent's own brand color
// (from opponentColor, threaded in from build_matrix_data.py's TEAM_COLORS)
// +white for an opponent win. A tie/non-numeric row gets no pill, same as
// the old code's "no .mc-lead class" behavior.
function pillSpan(text, color) {
  return `<span class="mc-pill" style="background:${color.bg};color:${color.fg};">${text}</span>`;
}

function renderCompareTable(elId, rows, us, opp, opponentColor) {
  const el = document.getElementById(elId);
  el.innerHTML = `<thead><tr><th class="mc-us">UNCW</th><th>&nbsp;</th><th class="mc-opp">Opp</th></tr></thead><tbody></tbody>`;
  const tbody = el.querySelector("tbody");
  const oppColor = opponentColor || {bg: "#54595F", fg: "#FFFFFF"};
  rows.forEach(([key, label]) => {
    const uv = us[key], ov = opp[key];
    const higherUs = typeof uv === "number" && typeof ov === "number" && uv > ov;
    const higherOpp = typeof uv === "number" && typeof ov === "number" && ov > uv;
    const suffix = key === "throwInPct" ? "%" : "";
    const usText = `${fmtVal(uv, key)}${uv != null ? suffix : ""}`;
    const ovText = `${fmtVal(ov, key)}${ov != null ? suffix : ""}`;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="mc-us">${higherUs ? pillSpan(usText, UNCW_TEAL) : usText}</td>` +
      `<td class="mc-label">${label}</td>` +
      `<td class="mc-opp">${higherOpp ? pillSpan(ovText, oppColor) : ovText}</td>`;
    tbody.appendChild(tr);
  });
}

      fallback = document.createElement("div");
      fallback.id = fallbackId;
      fallback.style.cssText = "text-align:center;color:var(--muted);font-size:12px;padding:20px 4px;";
      fallback.textContent = "Chart library didn't load -- try refreshing the page.";
      canvas.insertAdjacentElement("afterend", fallback);
    }
    return null;
  }
  if (canvas) canvas.hidden = false;
  if (fallback) fallback.hidden = true;
  const ctx = canvas.getContext("2d");
  return new Chart(ctx, {
    type: "line",
    data: {
      labels: minutes,
      datasets: [
        {label: "UNCW", data: usValues, borderColor: "#007680", backgroundColor: "#007680", stepped: true, pointRadius: 0, borderWidth: 2},
        {label: "Opponent", data: opValues, borderColor: "#003366", backgroundColor: "#003366", stepped: true, pointRadius: 0, borderWidth: 2},
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 2.2,
      plugins: {legend: {display: false}},
      scales: {
        x: {title: {display: true, text: "Minute in Match", font: {size: 10}}, ticks: {font: {size: 10}}},
        y: {title: {display: true, text: yLabel, font: {size: 10}}, ticks: {font: {size: 10}}, beginAtZero: true},
      },
    },
  });
}

function alignTo(minutes, values, target) {
  const out = [];
  let vi = 0;
  target.forEach(t => {
    while (vi < minutes.length - 1 && minutes[vi + 1] <= t) vi++;
    out.push(minutes[vi] <= t ? values[vi] : 0);
  });
  return out;
}

// ---- Match Center (ported from uncw_schedule_matrix_v5.html, same
// verified logic -- see data-quality-fixes.md's 2026-09-12 (v3.9) entry for
// the full column-mapping verification this was checked against -- now
// re-initialized per season instead of once at page load) ----
function initMatchCenter(season) {
  const note = document.getElementById("mc-note");
  const header = document.getElementById("mc-header");
  try {
    const mc = MATCH_CENTER_BY_SEASON[season] || {matches: []};
    const played = mc.matches.filter(m => m.played);
    if (!played.length) {
      if (note) note.textContent = "No match data yet.";
      header.innerHTML = "";
      document.getElementById("mc-stats-table").innerHTML = "";
      document.getElementById("mc-objectives-table").innerHTML = "";
      if (mcFlowChart) { mcFlowChart.destroy(); mcFlowChart = null; }
      if (mcXgChart) { mcXgChart.destroy(); mcXgChart = null; }
      selectMatch = () => {};
      return;
    }
    if (note) note.textContent = `${season} — ${played.length} match${played.length === 1 ? "" : "es"} played so far.`;

    const select = document.createElement("select");
    played.slice().reverse().forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.date;
      const d = new Date(m.date + "T12:00:00");
      opt.textContent = `${d.toLocaleDateString("en-US", {month: "short", day: "numeric"})} vs ${m.opponent} (${m.fullTimeScore}, ${m.result})` +
        (m.stats ? "" : " — data pending");
      select.appendChild(opt);
    });
    select.addEventListener("change", () => renderMatch(select.value));

    function renderMatch(dateStr) {
      const m = mc.matches.find(x => x.date === dateStr);
      if (!m) return;

      document.querySelectorAll("#schedule-table tr.sched-row-selected").forEach(tr => tr.classList.remove("sched-row-selected"));
      const schedRow = document.querySelector(`#schedule-table tr[data-date="${dateStr}"]`);
      if (schedRow) schedRow.classList.add("sched-row-selected");

      header.innerHTML = "";
      header.appendChild(select);
      const score = document.createElement("div");
      score.className = "mc-score";
      score.textContent = m.fullTimeScore;
      const result = document.createElement("span");
      result.className = `mc-result ${m.result}`;
      result.textContent = m.result;
      const meta = document.createElement("div");
      meta.className = "mc-meta";
      const d = new Date(m.date + "T12:00:00");
      meta.innerHTML = `vs <b>${m.opponent}</b> &middot; ${m.venue} &middot; ${d.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric"})}` +
        (m.rpi ? ` &middot; Opp RPI #${m.rpi}` : "") + (m.halftimeScore ? ` &middot; HT ${m.halftimeScore}` : "");
      header.appendChild(result);
      header.appendChild(score);
      header.appendChild(meta);

      if (!m.stats) {
        const pendingMsg = `<tbody><tr><td colspan="3" style="text-align:center;color:var(--muted);padding:10px 4px;">Match data not yet tagged</td></tr></tbody>`;
        document.getElementById("mc-stats-table").innerHTML = pendingMsg;
        document.getElementById("mc-objectives-table").innerHTML = pendingMsg;
        if (mcFlowChart) { mcFlowChart.destroy(); mcFlowChart = null; }
        if (mcXgChart) { mcXgChart.destroy(); mcXgChart = null; }
        document.getElementById("mc-flow-legend").innerHTML = "";
        document.getElementById("mc-xg-legend").innerHTML = "";
        return;
      }

      renderCompareTable("mc-stats-table", STAT_ROWS, m.stats.us, m.stats.opp, m.opponentColor);
      renderCompareTable("mc-objectives-table", OBJ_ROWS, m.objectives.us, m.objectives.opp, m.opponentColor);

      mcFlowChart = stepChart("mc-flow-chart", mcFlowChart, m.matchFlow.minutes, m.matchFlow.us, m.matchFlow.opp, "Match Flow Value");
      document.getElementById("mc-flow-legend").innerHTML =
        `<span>&#9632; UNCW <b>${m.matchFlow.us[m.matchFlow.us.length - 1].toFixed(2)}</b></span>` +
        `<span style="color:var(--navy);">&#9632; Opponent <b>${m.matchFlow.opp[m.matchFlow.opp.length - 1].toFixed(2)}</b></span>`;

      const allMinutes = Array.from(new Set([...m.xgFlow.us.minutes, ...m.xgFlow.opp.minutes])).sort((a, b) => a - b);
      const usAligned = alignTo(m.xgFlow.us.minutes, m.xgFlow.us.values, allMinutes);
      const opAligned = alignTo(m.xgFlow.opp.minutes, m.xgFlow.opp.values, allMinutes);
      mcXgChart = stepChart("mc-xg-chart", mcXgChart, allMinutes.map(v => Math.round(v)), usAligned, opAligned, "xG");
      document.getElementById("mc-xg-legend").innerHTML =
        `<span>&#9632; UNCW <b>${m.stats.us.xG.toFixed(3)}</b> xG</span>` +
        `<span style="color:var(--navy);">&#9632; Opponent <b>${m.stats.opp.xG.toFixed(3)}</b> xG</span>`;
    }

    selectMatch = function (dateStr) {
      select.value = dateStr;
      renderMatch(dateStr);
      document.getElementById("mc-header").scrollIntoView({behavior: "smooth", block: "start"});
    };

    select.value = played[played.length - 1].date;
    renderMatch(select.value);
  } catch (e) {
    console.error("Match Center failed to initialize -- rest of the page continues normally:", e);
    if (note) note.textContent = "Match Center couldn't load (see browser console for details). The rest of the page is unaffected.";
  }
}

function renderAll(season) {
  renderTrends(season);
  renderSchedule(season);
  initMatchCenter(season);
}

// ---- Season selector wiring ----
try {
  const seasonSelect = document.getElementById("fixtures-season-select");
  if (FIXTURES_SEASONS.length) {
    FIXTURES_SEASONS.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      seasonSelect.appendChild(opt);
    });
    seasonSelect.value = FIXTURES_SEASONS[0];
    seasonSelect.addEventListener("change", () => renderAll(seasonSelect.value));
    renderAll(FIXTURES_SEASONS[0]);
  } else {
    document.getElementById("fixtures-sub").textContent = "No schedule data yet.";
  }
} catch (e) {
  console.error("Fixtures season picker failed to initialize:", e);
}
</script>
