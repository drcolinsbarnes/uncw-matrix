// CAA_STANDINGS_END

// Same isolation practice as home.html: this page's own render logic is
// wrapped in try/catch (on top of sidebar.js already being its own
// <script> tag), so a data problem here degrades to a friendly message
// instead of taking anything else down.
try {
  const S = CAA_STANDINGS;
  const hasData = S && (S.south?.length || S.north?.length || S.overall?.length);
  document.getElementById("caa-sub").textContent = hasData
    ? "South, North, and Overall conference standings."
    : "No standings data yet.";

  // Same helper as home.html/fixtures.html/national_rpi_template.html --
  // renders an ordered W/L/D list as colored circles.
  function renderFormCircles(results) {
    if (!results || !results.length) return "—";
    return `<span class="form">` + results.map(r => {
      const cls = r === "W" ? "form-w" : r === "L" ? "form-l" : "form-d";
      const title = r === "W" ? "Win" : r === "L" ? "Loss" : "Draw";
      return `<span class="form-circle ${cls}" title="${title}">${r}</span>`;
    }).join("") + `</span>`;
  }

  function renderTable(elId, teams, opts) {
    opts = opts || {};
    const el = document.getElementById(elId);
    if (!el) return;
    if (!teams || !teams.length) {
      el.outerHTML = '<p class="note">No teams to show.</p>';
      return;
    }
    const sosHdr = opts.showSOS
      ? '<th class="num" title="Average current RPI rank of every opponent on the full schedule. Lower = tougher.">SOS</th>'
      : "";
    const liveHdr = '<th class="num" title="National rank by current-season RPI. 1 = best. Early-season ranks are based on very few games.">RPI</th>';
    // Non-Conference record column -- added 2026-09-15, Colin's ask: "I'd
    // like to see the non-conference record between RPI and Overall
    // Record", added to South/North/Overall here and mirrored on Home's
    // South table. Sits after RPI/SOS (the rank-type columns) and right
    // before Overall (the other record-type column), same grouping logic
    // as the existing RPI+SOS / Overall split.
    const nonConfHdr = '<th title="Non-conference record (excludes CAA games).">Non-Conf</th>';
    // Form column -- added 2026-09-15, Colin's follow-up: "add the form at
    // the end of the columns for all those tables/standings." Last 5
    // overall results (oldest->newest), same convention/circles as the
    // Season Record dashboard's own Form tile.
    const formHdr = '<th title="Form: last 5 results, oldest to newest.">Form</th>';
    el.innerHTML = `<thead><tr>
        <th class="num">Rk</th><th></th><th>Team</th><th class="num">P</th><th class="num">W</th>
        <th class="num">L</th><th class="num">D</th><th class="num">GF</th><th class="num">GA</th>
        <th class="num">GD</th><th class="num">Pts</th>${liveHdr}${sosHdr}${nonConfHdr}<th>Overall</th>${formHdr}
      </tr></thead><tbody></tbody>`;
    const tbody = el.querySelector("tbody");
    teams.forEach(t => {
      const tr = document.createElement("tr");
      if (t.name === "UNC Wilmington") tr.className = "uncw-row";
      const sosCell = opts.showSOS ? `<td class="num">${t.liveSos != null ? t.liveSos : "—"}</td>` : "";
      const liveCell = t.liveRpiRank != null
        ? `<td class="num" title="RPI ${t.liveRpi != null ? t.liveRpi.toFixed(4) : "?"} — ${t.liveRpiGp} game${t.liveRpiGp === 1 ? "" : "s"} played so far this season -- provisional.">${t.liveRpiRank}</td>`
        : `<td class="num">—</td>`;
      const stHref = `elo.html#/team/${encodeURIComponent(t.natName || t.name)}`;
      const nameCell = `<a class="team-link" href="${stHref}" title="${t.name} — full national schedule &amp; RPI detail">${t.name}</a>`;
      tr.innerHTML = `<td class="num">${t.rank}</td>
        <td>${t.logo ? `<img class="logo" src="${t.logo}" onerror="this.style.visibility='hidden'">` : ""}</td>
        <td>${nameCell}</td><td class="num">${t.played}</td><td class="num">${t.w}</td><td class="num">${t.l}</td>
        <td class="num">${t.d}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td>
        <td class="num">${t.gd > 0 ? "+" : ""}${t.gd}</td>
        <td class="num">${t.pts}</td>${liveCell}${sosCell}<td>${t.nonConfRecord || "—"}</td><td>${t.overall}</td>
        <td>${renderFormCircles(t.form)}</td>`;
      tbody.appendChild(tr);
    });
  }

  renderTable("south-table", S.south);
  renderTable("north-table", S.north);
  renderTable("overall-table", S.overall, {showSOS: true});

  // Remaining CAA schedule -- soonest date first, one block per date.
  // Added 2026-10-10 (Colin): "remaining schedule of games for CAA conference play".
  function renderCaaRemaining(elId, rounds, linkBase) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (!rounds || !rounds.length) { el.innerHTML = '<p class="note">No remaining CAA games on the schedule.</p>'; return; }
    const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric"});
    const team = t => {
      const href = linkBase + encodeURIComponent(t.natName || t.name);
      return `<td class="num">${t.rpiRank != null ? "#" + t.rpiRank : "—"}</td>` +
        `<td>${t.logo ? `<img class="logo" src="${t.logo}" onerror="this.style.visibility='hidden'">` : ""}</td>` +
        `<td><a class="team-link" href="${href}">${t.name}</a></td>`;
    };
    el.innerHTML = rounds.map(r => `
      <h3 style="margin:16px 0 6px;font-size:15px;color:#003366">${fmt(r.date)} <span class="muted" style="font-weight:400">· ${r.games.length} game${r.games.length === 1 ? "" : "s"}</span></h3>
      <div class="scroll-wrap"><table class="std"><thead><tr>
        <th class="num" title="National RPI rank">RPI</th><th></th><th>Home</th>
        <th class="num" title="National RPI rank">RPI</th><th></th><th>Away</th></tr></thead><tbody>` +
      r.games.map(g => `<tr${(g.home.name === "UNC Wilmington" || g.away.name === "UNC Wilmington") ? ' class="uncw-row"' : ""}>${team(g.home)}${team(g.away)}</tr>`).join("") +
      `</tbody></table></div>`).join("");
  }
  renderCaaRemaining("caa-remaining", S.remaining, "elo.html#/team/");
} catch (e) {
  console.error("CAA page failed to render:", e);
  document.getElementById("caa-sub").textContent = "Couldn't load standings (see browser console).";
}
</script>
