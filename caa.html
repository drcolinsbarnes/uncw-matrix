// instead of taking anything else down.
try {
  const S = CAA_STANDINGS;
  const hasData = S && (S.south?.length || S.north?.length || S.overall?.length);
  document.getElementById("caa-sub").textContent = hasData
    ? "South, North, and Overall conference standings."
    : "No standings data yet.";

  function renderTable(elId, teams, opts) {
    opts = opts || {};
    const el = document.getElementById(elId);
    if (!el) return;
    if (!teams || !teams.length) {
      el.outerHTML = '<p class="note">No teams to show.</p>';
      return;
    }
    const sosHdr = opts.showSOS
      ? '<th class="num" title="Average current RPI rank of every opponent on the full schedule. Lower = tougher.">SOS</th>'
      : "";
    const liveHdr = '<th class="num" title="National rank by current-season RPI. 1 = best. Early-season ranks are based on very few games.">RPI</th>';
    el.innerHTML = `<thead><tr>
        <th class="num">Rk</th><th></th><th>Team</th><th class="num">P</th><th class="num">W</th>
        <th class="num">L</th><th class="num">D</th><th class="num">GF</th><th class="num">GA</th>
        <th class="num">GD</th><th class="num">Pts</th>${liveHdr}${sosHdr}<th>Overall</th>
      </tr></thead><tbody></tbody>`;
    const tbody = el.querySelector("tbody");
    teams.forEach(t => {
      const tr = document.createElement("tr");
      if (t.name === "UNC Wilmington") tr.className = "uncw-row";
      const sosCell = opts.showSOS ? `<td class="num">${t.liveSos != null ? t.liveSos : "—"}</td>` : "";
      const liveCell = t.liveRpiRank != null
        ? `<td class="num" title="RPI ${t.liveRpi != null ? t.liveRpi.toFixed(4) : "?"} — ${t.liveRpiGp} game${t.liveRpiGp === 1 ? "" : "s"} played so far this season -- provisional.">${t.liveRpiRank}</td>`
        : `<td class="num">—</td>`;
      const stHref = `national_rpi.html#/team/${encodeURIComponent(t.natName || t.name)}`;
      const nameCell = `<a class="team-link" href="${stHref}" title="${t.name} — full national schedule &amp; RPI detail">${t.name}</a>`;
      tr.innerHTML = `<td class="num">${t.rank}</td>
        <td>${t.logo ? `<img class="logo" src="${t.logo}" onerror="this.style.visibility='hidden'">` : ""}</td>
        <td>${nameCell}</td><td class="num">${t.played}</td><td class="num">${t.w}</td><td class="num">${t.l}</td>
        <td class="num">${t.d}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td>
        <td class="num">${t.gd > 0 ? "+" : ""}${t.gd}</td>
        <td class="num">${t.pts}</td>${liveCell}${sosCell}<td>${t.overall}</td>`;
      tbody.appendChild(tr);
    });
  }

  renderTable("south-table", S.south);
  renderTable("north-table", S.north);
  renderTable("overall-table", S.overall, {showSOS: true});
} catch (e) {
  console.error("CAA page failed to render:", e);
  document.getElementById("caa-sub").textContent = "Couldn't load standings (see browser console).";
}
