<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats — UNCW Coaching Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css?v=3.0">
<style>
  .stats-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .stats-toolbar label.season-label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stats-toolbar select { font-family: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); }

  .category-toggle { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .cat-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: none; border: none;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .cat-btn:hover { color: var(--navy); }
  .cat-btn.active { background: var(--navy); color: #fff; }

  .opp-toggle { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .opp-toggle input { cursor: pointer; }
  .opp-toggle.disabled { color: var(--muted); cursor: not-allowed; }
  .opp-toggle.disabled input { cursor: not-allowed; }

  .advanced-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--navy); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  .advanced-btn:hover { background: var(--bg); }
  .advanced-btn.open { background: var(--navy); color: #fff; }

  .advanced-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px 6px; margin-bottom: 12px;
  }
  .advanced-groups { display: flex; gap: 22px; flex-wrap: wrap; }
  .advanced-group h4 { margin: 0 0 6px; font-size: 12px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.4px; }
  .advanced-group label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin-bottom: 5px; cursor: pointer; white-space: nowrap; }
  .advanced-actions { display: flex; gap: 10px; margin: 10px 0 4px; }
  .advanced-actions button {
    font-family: inherit; font-size: 12px; font-weight: 600; color: var(--teal); background: none;
    border: none; padding: 0; cursor: pointer; text-decoration: underline;
  }

  #stats-note { margin-top: 0; }

  table#stats-table { width: max-content; min-width: 100%; }
  table#stats-table th, table#stats-table td { white-space: nowrap; text-align: center; }
  table#stats-table td.num, table#stats-table th.num { text-align: center; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #004a80; }
  th.sortable.sorted { background: var(--teal); }
  .sort-arrow { display: inline-block; margin-left: 3px; font-size: 9px; opacity: 0.85; }
  th.sortable:not(.sorted) .sort-arrow { opacity: 0.35; }
  table#stats-table tbody tr:nth-child(even) td { background: inherit; } /* neutralize table.std default -- we stripe by match group below */
  table#stats-table tbody tr.grp-even td { background: #ffffff; }
  table#stats-table tbody tr.grp-odd td { background: #eef1f3; }
  table#stats-table tbody tr.us-row td { border-top: none; }

  .team-pill {
    display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px;
  }
  .team-pill .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

  .type-pill { display: inline-block; min-width: 26px; padding: 2px 9px; border-radius: 999px; font-weight: 700; font-size: 10.5px; line-height: 1.6; }
  .type-pill-nc, .type-pill-conf { background: var(--navy); color: #fff; }
  .type-pill-exh { background: var(--teal); color: #fff; }

  td.result-w { color: var(--win-text); font-weight: 700; }
  td.result-l { color: var(--loss-text); font-weight: 700; }
  td.result-d { color: var(--muted); font-weight: 700; }

  .stats-empty { background: var(--card); border: 1px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body data-page="stats">
<div class="app-layout">
  <nav class="app-sidebar" id="app-sidebar"></nav>
  <main class="app-main">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <h1 class="page-title" style="margin-bottom:0;">Stats</h1>
      <label class="season-label">
        Season
        <select id="stats-season-select"></select>
      </label>
    </div>
    <p class="sub" id="stats-note">Loading&hellip;</p>

    <div class="stats-toolbar">
      <div class="category-toggle" id="category-toggle">
        <button class="cat-btn" data-cat="attacking">Attacking</button>
        <button class="cat-btn" data-cat="defending">Defending</button>
        <button class="cat-btn" data-cat="transition">Transition</button>
        <button class="cat-btn" data-cat="physical">Physical</button>
      </div>
      <label class="opp-toggle" id="opp-toggle-label">
        <input type="checkbox" id="opp-compare-toggle">
        Compare to opponent
      </label>
      <button class="advanced-btn" id="advanced-toggle-btn">Advanced columns &#9662;</button>
    </div>

    <div class="advanced-panel" id="advanced-panel" hidden>
      <p class="sub" style="margin-top:0;">Pick any combination of columns from the full stat list -- overrides the category buttons above as soon as you check or uncheck something.</p>
      <div class="advanced-groups" id="advanced-groups"></div>
      <div class="advanced-actions">
        <button id="adv-select-all" type="button">Select all</button>
        <button id="adv-select-none" type="button">Clear all</button>
      </div>
    </div>

    <div class="scroll-wrap">
      <table class="std" id="stats-table"></table>
    </div>
  </main>
</div>

const UNCW_TEAL = {bg: "#007680", fg: "#FFFFFF"};
const UNCW_NAVY = {bg: "#003366", fg: "#FFFFFF"};

// State
let currentSeason = null;
let activeCategory = "attacking"; // null once the Advanced panel diverges from any single category's exact set
let selectedKeys = [];
let compareOn = false;

// ---- Sorting -- click a column heading to sort by it, most-to-least
// (descending) on the first click, flipping to least-to-most on a second
// click of the SAME column; clicking a different column always starts
// fresh at descending. Sorts at the match level (by UNCW's own "us"
// value for a stat, even with "Compare to opponent" on, since a match's
// two comparison rows always travel together). Missing/untagged values
// always sink to the bottom regardless of direction. Mirrors squad.html's
// identical sortRows()/compareValues() pattern so both pages behave the
// same way. ------------------------------------------------------------
let statsSort = {key: null, dir: "desc"};

function isBlank(v) { return v === null || v === undefined || v === ""; }

function compareValues(va, vb, dir) {
  const aBlank = isBlank(va), bBlank = isBlank(vb);
  if (aBlank && bBlank) return 0;
  if (aBlank) return 1;
  if (bBlank) return -1;
  let cmp;
  if (typeof va === "number" && typeof vb === "number") cmp = va - vb;
  else {
    const sa = String(va).toLowerCase(), sb = String(vb).toLowerCase();
    cmp = sa < sb ? -1 : sa > sb ? 1 : 0;
  }
  return dir === "desc" ? -cmp : cmp;
}

function sortRows(rows, sortState, valueGetter) {
  if (!sortState.key) return rows;
  const withIdx = rows.map((r, i) => ({r, i}));
  withIdx.sort((a, b) => {
    const cmp = compareValues(valueGetter(a.r, sortState.key), valueGetter(b.r, sortState.key), sortState.dir);
    return cmp !== 0 ? cmp : a.i - b.i;
  });
  return withIdx.map(x => x.r);
}

function sortArrow(key, sortState) {
  const active = sortState.key === key;
  const glyph = active && sortState.dir === "asc" ? "▲" : "▼";
  return `<span class="sort-arrow">${glyph}</span>`;
}

function thSort(text, key, sortState, cls, tooltip) {
  const sorted = sortState.key === key ? " sorted" : "";
  const t = tooltip ? ` title="${tooltip}"` : "";
  return `<th class="sortable${sorted}${cls ? " " + cls : ""}" data-key="${key}"${t}>${text}${sortArrow(key, sortState)}</th>`;
}

function onSortHeaderClick(e, sortState, rerender) {
  const th = e.target.closest("th[data-key]");
  if (!th) return;
  const key = th.dataset.key;
  if (sortState.key === key) {
    sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
  } else {
    sortState.key = key;
    sortState.dir = "desc";
  }
  rerender();
}

function statsRowValue(m, key) {
  if (key === "date") return m.date;
  if (key === "type") return m.type;
  if (key === "opponent") return m.opponent;
  if (key === "result") return m.result;
  if (key === "fullTimeScore") return m.fullTimeScore;
  return m.values[key] ? m.values[key].us : null;
}

function catalogForSeason() {
  const s = STATS_BY_SEASON[currentSeason];
  return (s && s.catalog) || [];
}
function catalogByKey() {
  const map = {};
  catalogForSeason().forEach(c => { map[c.key] = c; });
  return map;
}
function keysForCategory(cat) {
  return catalogForSeason().filter(c => c.category === cat).map(c => c.key);
}

// Value formatting -- mirrors fixtures.html's fmtVal for the 33 stats
// already shown there (so the same stat reads the same everywhere), plus
// the 3 new team physical stats using the same units as Squad's
// per-player physical stats (physTopSpeed/physHiRatio/physDistP90).
function fmtVal(key, v) {
  if (v === null || v === undefined) return "—";
  if (key === "throwInPct" || key === "physTeamHiRatio") return v.toFixed(1) + "%";
  if (key === "physTeamTopSpeed") return v.toFixed(1) + " mph";
  if (key === "physTeamDist") return Math.round(v).toLocaleString() + " m";
  if (typeof v === "number" && !Number.isInteger(v)) return v.toFixed(v < 10 ? 3 : 1);
  return v;
}

function typePillHtml(type) {
  if (!type) return "—";
  const cls = type === "Exhibition" ? "type-pill-exh" : (type === "Conference" ? "type-pill-conf" : "type-pill-nc");
  return `<span class="type-pill ${cls}">${type === "Non-Conference" ? "NC" : type === "Conference" ? "CONF" : type === "Exhibition" ? "EXH" : type}</span>`;
}

function resultClass(r) {
  if (r === "Win") return "result-w";
  if (r === "Loss") return "result-l";
  if (r === "Draw") return "result-d";
  return "";
}

function teamPillHtml(name, color) {
  const c = color || {bg: "#54595F", fg: "#FFFFFF"};
  return `<span class="team-pill"><span class="dot" style="background:${c.bg};border:1px solid ${c.bg === "#FFFFFF" ? "#ccc" : c.bg};"></span>${name}</span>`;
}

// ---- Category buttons ----

function isPurePhysical(keys) {
  return keys.length > 0 && keys.every(k => (catalogByKey()[k] || {}).category === "physical");
}

function applyCategory(cat) {
  activeCategory = cat;
  selectedKeys = keysForCategory(cat);
  syncControls();
  renderTable();
}

function syncControls() {
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === activeCategory));

  // Physical has no opponent data at all (confirmed -- no opponent GPS/
  // physical tracking exists anywhere in the source files), so comparison
  // is disabled and forced off whenever the *entire* current selection is
  // physical-only. A mixed Advanced selection (physical + something else)
  // leaves comparison available -- the physical columns just show an
  // em-dash for the opponent, same as any other missing value.
  const oppToggle = document.getElementById("opp-compare-toggle");
  const oppLabel = document.getElementById("opp-toggle-label");
  const pureP = isPurePhysical(selectedKeys);
  oppToggle.disabled = pureP;
  oppLabel.classList.toggle("disabled", pureP);
  if (pureP) { compareOn = false; oppToggle.checked = false; }

  renderAdvancedPanel();
}

// ---- Advanced column picker ----

const CATEGORY_LABELS = {attacking: "Attacking", defending: "Defending", transition: "Transition", physical: "Physical"};

function renderAdvancedPanel() {
  const container = document.getElementById("advanced-groups");
  const cats = ["attacking", "defending", "transition", "physical"];
  const selectedSet = new Set(selectedKeys);
  container.innerHTML = cats.map(cat => {
    const items = catalogForSeason().filter(c => c.category === cat);
    if (!items.length) return "";
    const boxes = items.map(c => `
      <label><input type="checkbox" class="adv-check" value="${c.key}" ${selectedSet.has(c.key) ? "checked" : ""}> ${c.label}</label>`).join("");
    return `<div class="advanced-group"><h4>${CATEGORY_LABELS[cat]}</h4>${boxes}</div>`;
  }).join("");
  container.querySelectorAll(".adv-check").forEach(cb => {
    cb.addEventListener("change", onAdvancedCheckChange);
  });
}

function onAdvancedCheckChange() {
  selectedKeys = Array.from(document.querySelectorAll(".adv-check:checked")).map(cb => cb.value);
  // If the checked set happens to exactly match one category's full set,
  // keep that button highlighted; otherwise this is a custom mix, so no
  // single category button is "active" anymore.
  const cats = ["attacking", "defending", "transition", "physical"];
  const match = cats.find(cat => {
    const catKeys = keysForCategory(cat);
    return catKeys.length === selectedKeys.length && catKeys.every(k => selectedKeys.includes(k));
  });
  activeCategory = match || null;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === activeCategory));

  const oppToggle = document.getElementById("opp-compare-toggle");
  const oppLabel = document.getElementById("opp-toggle-label");
  const pureP = isPurePhysical(selectedKeys);
  oppToggle.disabled = pureP;
  oppLabel.classList.toggle("disabled", pureP);
  if (pureP) { compareOn = false; oppToggle.checked = false; }

  renderTable();
}

// ---- Table ----

function renderTable() {
  const el = document.getElementById("stats-table");
  const data = STATS_BY_SEASON[currentSeason];
  let matches = (data && data.matches) || [];
  const byKey = catalogByKey();
  const keys = selectedKeys.filter(k => byKey[k]); // guard against a stale key if catalog ever changes shape

  document.getElementById("stats-note").textContent = matches.length
    ? `${matches.length} played, tagged match${matches.length === 1 ? "" : "es"} this season -- games without full stat tagging yet aren't shown. Click any column heading to sort (click again to flip low-to-high).`
    : "No played, stat-tagged matches yet this season.";

  if (!matches.length) {
    el.innerHTML = `<tbody><tr><td class="stats-empty" style="border:none;">No matches to show for ${currentSeason} yet.</td></tr></tbody>`;
    return;
  }

  matches = sortRows(matches, statsSort, statsRowValue);

  const statHeaders = keys.map(k => thSort(byKey[k].abbr, k, statsSort, "num", byKey[k].label)).join("");
  const teamColLabel = compareOn ? "Team" : "Opponent";
  const head = `<tr>${thSort("Date", "date", statsSort)}${thSort("Type", "type", statsSort)}` +
    `${thSort(teamColLabel, "opponent", statsSort)}${thSort("Result", "result", statsSort)}` +
    `${thSort("Score", "fullTimeScore", statsSort)}${statHeaders}</tr>`;

  const rows = matches.map((m, i) => {
    const grp = i % 2 === 0 ? "grp-even" : "grp-odd";
    const statCells = side => keys.map(k => {
      const v = m.values[k] ? m.values[k][side] : null;
      return `<td class="num">${fmtVal(k, v)}</td>`;
    }).join("");

    if (!compareOn) {
      return `
        <tr class="${grp}">
          <td>${m.date}</td>
          <td>${typePillHtml(m.type)}</td>
          <td>${teamPillHtml(m.opponent, m.opponentColor)}</td>
          <td class="${resultClass(m.result)}">${m.result || "—"}</td>
          <td>${m.fullTimeScore || "—"}</td>
          ${statCells("us")}
        </tr>`;
    }

    return `
      <tr class="${grp} opp-row">
        <td rowspan="2">${m.date}</td>
        <td rowspan="2">${typePillHtml(m.type)}</td>
        <td>${teamPillHtml(m.opponent, m.opponentColor)}</td>
        <td rowspan="2" class="${resultClass(m.result)}">${m.result || "—"}</td>
        <td rowspan="2">${m.fullTimeScore || "—"}</td>
        ${statCells("opp")}
      </tr>
      <tr class="${grp} us-row">
        <td>${teamPillHtml("UNCW", UNCW_NAVY)}</td>
        ${statCells("us")}
      </tr>`;
  }).join("");

  el.innerHTML = `<thead>${head}</thead><tbody>${rows}</tbody>`;
}

// ---- Wiring ----

// #stats-table's own innerHTML is replaced on every render but the
// <table id="stats-table"> node itself never is, so this listener stays
// attached across season/category/compare-toggle changes.
document.getElementById("stats-table").addEventListener("click", e => {
  onSortHeaderClick(e, statsSort, renderTable);
});

document.getElementById("category-toggle").addEventListener("click", e => {
  const btn = e.target.closest(".cat-btn");
  if (btn) applyCategory(btn.dataset.cat);
});

document.getElementById("opp-compare-toggle").addEventListener("change", e => {
  compareOn = e.target.checked;
  renderTable();
});

document.getElementById("advanced-toggle-btn").addEventListener("click", () => {
  const panel = document.getElementById("advanced-panel");
  panel.hidden = !panel.hidden;
  document.getElementById("advanced-toggle-btn").classList.toggle("open", !panel.hidden);
});

document.getElementById("adv-select-all").addEventListener("click", () => {
  selectedKeys = catalogForSeason().map(c => c.key);
  activeCategory = null;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  renderAdvancedPanel();
  const oppToggle = document.getElementById("opp-compare-toggle");
  document.getElementById("opp-toggle-label").classList.remove("disabled");
  oppToggle.disabled = false;
  renderTable();
});
document.getElementById("adv-select-none").addEventListener("click", () => {
  selectedKeys = [];
  activeCategory = null;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  renderAdvancedPanel();
  renderTable();
});

function initSeasonSelect() {
  const select = document.getElementById("stats-season-select");
  const seasons = Object.keys(STATS_BY_SEASON || {});
  select.innerHTML = seasons.map(s => `<option value="${s}">${s}</option>`).join("");
  currentSeason = seasons.includes("Fall 2026") ? "Fall 2026" : seasons[0];
  select.value = currentSeason;
  select.addEventListener("change", () => {
    currentSeason = select.value;
    applyCategory(activeCategory || "attacking");
  });
}
