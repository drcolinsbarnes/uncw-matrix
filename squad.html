<style>
  :root {
    --navy: #003366; --teal: #007680; --yellow: #f3e389;
    --bg: #f5f7f8; --card: #ffffff; --border: #d8e0e4; --text: #12242f; --muted: #5c7280;
    --win: #e2f0ee; --win-text: #00524c; --loss: #fbeaea; --loss-text: #7a2222;
  }
  * { box-sizing: border-box; }
  body { font-family: "Tomorrow", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Leaderboards view ---- */
  .table-label { font-weight: 600; font-size: 13px; margin-bottom: 2px; color: var(--navy); }
  .table-sub { font-weight: 400; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  table.std td a.player-link { color: inherit; text-decoration: none; font-weight: 600; }
  table.std td a.player-link:hover { color: var(--teal); text-decoration: underline; }
  .lb-empty-note { background: var(--card); border: 1px dashed var(--border); border-radius: 8px; padding: 14px 16px; color: var(--muted); font-size: 12.5px; }
  .up-arrow { color: #1a7f37; }
  .down-arrow { color: #c0392b; }
  .flat-arrow { color: var(--muted); }

  /* ---- Full roster ---- */
  table.roster td.pos-cell { font-weight: 700; color: var(--navy); }
  table.roster td.no-data-note { color: var(--muted); font-size: 11px; font-style: italic; }

  /* ---- Player detail view ---- */
  .player-header {
    display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--border);
    border-top: 3px solid var(--teal); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .player-header img.headshot, .player-header .headshot-fallback {
    height: 72px; width: 72px; object-fit: cover; border-radius: 50%; flex: none;
    border: 2px solid var(--border); background: #dfe6ea;
  }
  .player-header .headshot-fallback { display: flex; align-items: center; justify-content: center; }
  .player-header .id h2 { margin: 0; font-size: 19px; color: var(--navy); }
  .player-header .id .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .jersey-badge {
    display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px;
    padding: 0 5px; border-radius: 5px; background: var(--navy); color: #fff; font-weight: 700; font-size: 12px;
  }
  .pos-badge {
    display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 20px;
    padding: 0 6px; border-radius: 4px; background: var(--teal); color: #fff; font-weight: 700; font-size: 11px;
  }
  .no-bio-flag { font-size: 11px; color: var(--muted); font-style: italic; }

  .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: none;
    padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--navy); }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--teal); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  table.matchlog { border-collapse: collapse; font-size: 12px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  table.matchlog th { text-align: left; background: var(--navy); color: #fff; font-weight: 600; padding: 6px 8px; white-space: nowrap; }
  table.matchlog th.num, table.matchlog td.num { text-align: right; }
  table.matchlog td { padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.matchlog tr:nth-child(even) td { background: rgba(0, 118, 128, 0.05); }
  table.matchlog td.result-w { color: var(--win-text); font-weight: 700; }
  table.matchlog td.result-l { color: var(--loss-text); font-weight: 700; }
  table.matchlog td.result-d { color: var(--muted); font-weight: 700; }
  td.stat-cell.dir-up { color: #1a7f37; }
  td.stat-cell.dir-down { color: #c0392b; }
  td.stat-cell.dir-even { color: var(--muted); }
  td.stat-cell .stat-main { font-weight: 600; color: var(--text); }
  td.stat-cell .stat-delta { font-size: 10.5px; margin-left: 2px; }
  .scroll-wrap { overflow-x: auto; padding-bottom: 6px; }
  .empty-state { background: var(--card); border: 1px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
  .not-found { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>

// Display metadata + formatting for every stat key -- must mirror
// STAT_META / the rounding build_matrix_data.py's _player_slice_metrics()
// already applied server-side. Kept as a plain lookup here (not derived
// from SQUAD_DATA) so column order and formatting stay in Claude's/this
// file's control regardless of what order Python happens to emit.
const STAT_META = {
  gc: {label: "Goal Contributions", decimals: 0, suffix: ""},
  win2: {label: "Win+2", decimals: 2, suffix: ""},
  ropDz: {label: "RoP DZ Entries", decimals: 2, suffix: ""},
  faceUp: {label: "Face Up", decimals: 2, suffix: ""},
  firstContact: {label: "First Contact (SP)", decimals: 2, suffix: ""},
  dzDefending: {label: "DZ Defending", decimals: 2, suffix: ""},
  defContrib: {label: "Defensive Contribution", decimals: 2, suffix: ""},
  physTopSpeed: {label: "Avg Top Speed", decimals: 1, suffix: " mph"},
  physHiRatio: {label: "Hi-Intensity Ratio", decimals: 1, suffix: "%"},
  physDistP90: {label: "Distance/90", decimals: 0, suffix: " m", thousands: true},
};

function fmtStat(key, v) {
  if (v === null || v === undefined) return "—";
  const m = STAT_META[key] || {decimals: 2, suffix: ""};
  const s = m.thousands ? v.toLocaleString(undefined, {maximumFractionDigits: m.decimals}) : v.toFixed(m.decimals);
  return s + m.suffix;
}
function fmtDelta(key, v) {
  if (v === null || v === undefined) return "";
  const m = STAT_META[key] || {decimals: 2, suffix: ""};
  const sign = v > 0 ? "+" : "";
  return sign + v.toFixed(m.decimals);
}
function arrowChar(dir) {
  return dir === "up" ? "▲" : dir === "down" ? "▼" : "—";
}

function playerLink(name, extraClass) {
  if (!name) return "";
  return `<a class="player-link ${extraClass || ''}" href="#/player/${encodeURIComponent(name)}">${name}</a>`;
}

// Generic silhouette used whenever a headshot URL is missing or fails to
// load -- Colin's 2026-09-15 decision: a player with incomplete historical
// data still gets a full page, never excluded from navigation, so there's
// always something to show in the header photo slot.
const SILHOUETTE_SVG = `data:image/svg+xml;utf8,${encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72"><rect width="72" height="72" fill="#dfe6ea"/><circle cx="36" cy="27" r="14" fill="#aebac2"/><path d="M10 66c0-16 12-26 26-26s26 10 26 26" fill="#aebac2"/></svg>'
)}`;

function headshotHtml(p) {
  if (p.headshot) {
    return `<img class="headshot" src="${p.headshot}" onerror="this.outerHTML='<div class=&quot;headshot-fallback&quot; style=&quot;height:72px;width:72px;border-radius:50%;background:url(${SILHOUETTE_SVG}) center/cover;&quot;></div>';">`;
  }
  return `<div class="headshot-fallback" style="height:72px;width:72px;border-radius:50%;background:url('${SILHOUETTE_SVG}') center/cover;"></div>`;
}

// ---- Leaderboards view ----

// Full ranked list (not top-3) -- ties share a rank, same tie logic as the
// classic dashboard's renderLeaderboard(), just without the top-3 cutoff
// since Squad has room for a real leaderboard, not a summary widget.
function renderStatTable(stat) {
  const rows = stat.rows || [];
  let body;
  if (!rows.length) {
    body = `<tr><td colspan="3" class="note">No qualifying players yet</td></tr>`;
  } else {
    let rank = 1, prevVal = null, out = [];
    rows.forEach((r, i) => {
      if (prevVal !== null && r.value !== prevVal) rank = i + 1;
      let valText = fmtStat(stat.key, r.value);
      if (r.pct != null) valText += ` <span style="color:var(--muted);font-weight:400;">(${r.pct}%)</span>`;
      if (r.trendDir) {
        const cls = r.trendDir === "up" ? "up-arrow" : r.trendDir === "down" ? "down-arrow" : "flat-arrow";
        valText += ` <span class="${cls}" title="Trending ${r.trendDir}">${arrowChar(r.trendDir === "flat" ? "even" : r.trendDir)}</span>`;
      }
      out.push(`<tr><td class="num">${rank}</td><td>${playerLink(r.name)}</td><td class="num">${valText}</td></tr>`);
      prevVal = r.value;
    });
    body = out.join("");
  }
  return `
    <div>
      <div class="table-label">${stat.label}</div>
      <div class="table-sub">${stat.sub}</div>
      <table class="std"><thead><tr><th class="num">Rk</th><th>Player</th><th class="num">${stat.label}</th></tr></thead><tbody>${body}</tbody></table>
    </div>`;
}

function renderCategory(catKey, elId) {
  const el = document.getElementById(elId);
  const cat = (SQUAD_DATA.categories || []).find(c => c.key === catKey);
  if (!cat || !cat.stats.length) {
    el.innerHTML = `<div class="lb-empty-note">No ${catKey}-specific stat has been built yet -- flagged as future work, not a bug.</div>`;
    return;
  }
  el.innerHTML = cat.stats.map(renderStatTable).join("");
}

const POSITION_ORDER = ["GK", "CB", "OB", "DM", "AM", "WF", "CF", "Unknown"];

function renderRoster() {
  const players = Object.values(SQUAD_DATA.players || {});
  players.sort((a, b) => {
    const pa = POSITION_ORDER.indexOf(a.position), pb = POSITION_ORDER.indexOf(b.position);
    if (pa !== pb) return pa - pb;
    return (a.jersey ?? 999) - (b.jersey ?? 999);
  });
  const rows = players.map(p => `
    <tr>
      <td class="pos-cell">${p.position}</td>
      <td class="num">${p.jersey ?? "—"}</td>
      <td>${playerLink(p.name)}${!p.hasIdentity ? ' <span class="no-data-note" title="No entry in the roster file -- shown with a generic photo and Unknown position">(no bio on file)</span>' : ''}</td>
      <td>${p.year || "—"}</td>
      <td>${p.matches.length ? `${p.matches.length} match${p.matches.length === 1 ? '' : 'es'} tracked` : '<span class="no-data-note">No match data yet</span>'}</td>
    </tr>`).join("");
  document.getElementById("roster-table").innerHTML = `
    <thead><tr><th>Pos</th><th class="num">#</th><th>Player</th><th>Year</th><th>Data</th></tr></thead>
    <tbody>${rows}</tbody>`;
}

function renderLeaderboards() {
  document.getElementById("asof-line").textContent = SQUAD_DATA.gamesPlayed
    ? `Through ${SQUAD_DATA.asOf}, ${SQUAD_DATA.gamesPlayed} games this season -- ties at the cutoff shown; rate stats need ${SQUAD_DATA.qualifyMinutes}+ minutes to qualify. First draft of the category groupings -- Colin to refine after review.`
    : "No player data yet.";
  renderCategory("attacking", "cat-attacking");
  renderCategory("defending", "cat-defending");
  renderCategory("physical", "cat-physical");
  renderCategory("goalkeeping", "cat-goalkeeping");
  renderRoster();
}

// ---- Player detail view ----

function resultClass(r) {
  if (r === "Win") return "result-w";
  if (r === "Loss") return "result-l";
  if (r === "Draw") return "result-d";
  return "";
}

function renderMatchTab(p) {
  if (!p.matches.length) {
    return `<div class="empty-state">No match data tracked yet for ${p.name}.</div>`;
  }
  const keys = p.matchStatKeys || [];
  const matches = p.matches.slice().reverse(); // most recent first
  const statCols = keys.map(k => `<th class="num" title="${STAT_META[k] ? STAT_META[k].label : k}">${STAT_META[k] ? STAT_META[k].label : k}</th>`).join("");
  const rows = matches.map(m => {
    const statLines = keys.map(k => {
      const s = (m.stats || []).find(x => x.key === k);
      if (!s) return `<td class="num">—</td>`;
      return `<td class="num stat-cell dir-${s.direction}"><span class="stat-main">${fmtStat(k, s.match)}</span> <span class="stat-delta">${arrowChar(s.direction)} ${fmtDelta(k, s.delta)}</span></td>`;
    }).join("");
    return `
      <tr>
        <td>${m.date}</td>
        <td>${m.opponent || "—"}</td>
        <td>${m.venue || "—"}</td>
        <td class="${resultClass(m.result)}">${m.result || "—"}</td>
        <td class="num">${m.minutes}</td>
        <td class="num">${m.goals}</td>
        <td class="num">${m.assists}</td>
        ${statLines}
      </tr>`;
  }).join("");
  const note = keys.length
    ? `<p class="sub">Value shown with the arrow/delta vs. that match's own season average -- curated for ${p.position}. ${STAT_META[keys[0]] ? '' : ''}</p>`
    : `<p class="sub">No position-specific match stats defined for ${p.position} yet.</p>`;
  return `
    ${note}
    <div class="scroll-wrap">
      <table class="matchlog">
        <thead><tr><th>Date</th><th>Opponent</th><th>Venue</th><th>Result</th><th class="num">Min</th><th class="num">G</th><th class="num">A</th>${statCols}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderCareerTab(p) {
  if (!p.seasons.length) {
    return `<div class="empty-state">No season data tracked yet for ${p.name}.</div>`;
  }
  const cols = ["win2", "ropDz", "faceUp", "firstContact", "dzDefending", "defContrib", "physTopSpeed", "physHiRatio", "physDistP90"];
  const head = cols.map(k => `<th class="num">${STAT_META[k].label}</th>`).join("");
  const rows = p.seasons.map(s => {
    const cells = cols.map(k => {
      if (k === "dzDefending" && s.dzDefendingPct != null) {
        return `<td class="num">${fmtStat(k, s[k])} <span style="color:var(--muted);">(${s.dzDefendingPct}%)</span></td>`;
      }
      return `<td class="num">${fmtStat(k, s[k])}</td>`;
    }).join("");
    return `
      <tr>
        <td>${s.season}</td>
        <td class="num">${s.matches}</td>
        <td class="num">${s.minutes}</td>
        <td class="num">${s.goals}</td>
        <td class="num">${s.assists}</td>
        ${cells}
      </tr>`;
  }).join("");
  return `
    <p class="sub">One row per season this player has appeared in. Full match-by-match detail is on the Match tab.</p>
    <div class="scroll-wrap">
      <table class="matchlog">
        <thead><tr><th>Season</th><th class="num">Matches</th><th class="num">Min</th><th class="num">G</th><th class="num">A</th>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderPlayer(name) {
  const p = SQUAD_DATA.players && SQUAD_DATA.players[name];
  const container = document.getElementById("player-content");
  if (!p) {
    container.innerHTML = `<div class="not-found">No Squad data for "${name}". <a href="#/leaderboards">Back to Squad</a></div>`;
    return;
  }
  container.innerHTML = `
    <p class="sub"><a href="#/leaderboards">&larr; Back to Squad</a></p>
    <div class="player-header">
      ${headshotHtml(p)}
      <div class="id">
        <h2>${p.name}</h2>
        <div class="meta">
          ${p.jersey != null ? `<span class="jersey-badge">#${p.jersey}</span>` : ""}
          <span class="pos-badge">${p.position}</span>
          <span>${p.year || "Year unknown"}</span>
          ${!p.hasIdentity ? '<span class="no-bio-flag">No roster-file entry on record -- generic photo/Unknown position shown</span>' : ""}
        </div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="match">Match</button>
      <button class="tab-btn" data-tab="career">Career</button>
    </div>
    <div class="tab-panel active" id="tab-match">${renderMatchTab(p)}</div>
    <div class="tab-panel" id="tab-career">${renderCareerTab(p)}</div>
  `;
  container.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      container.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      container.querySelectorAll(".tab-panel").forEach(pnl => pnl.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    });
  });
}

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function route() {
  const hash = location.hash || "#/leaderboards";
  const playerMatch = hash.match(/^#\/player\/(.+)$/);
  if (playerMatch) {
    renderPlayer(decodeURIComponent(playerMatch[1]));
    showView("view-player");
    window.scrollTo(0, 0);
  } else {
    showView("view-leaderboards");
  }
}

window.addEventListener("hashchange", route);
renderLeaderboards();
route();
</script>
</body>
