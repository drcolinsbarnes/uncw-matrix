<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer Portal — UNCW Coaching Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css?v=2.9">
<style>
  /* Transfer Portal page (2026-09-24): the live Supabase-backed app from the
     uncw-recruiting-app Cloudflare project, framed inside the Matrix shell so
     it sits in the same sidebar as every other page. The app itself is
     unchanged -- it runs from its own URL (/transfer-app/) inside the frame.
     Only works when this page is served from the Cloudflare site (same
     origin, so the app's login + browser storage behave normally); the
     GitHub Pages copy shows a link-out card instead. */
  :root { --navy: #003366; --teal: #007680; --yellow: #f3e389; --bg: #f5f7f8;
          --card: #ffffff; --border: #d8e0e4; --text: #12242f; --muted: #5c7280; }
  * { box-sizing: border-box; }
  body { font-family: "Tomorrow", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); margin: 0; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .app-main.frame-main { padding: 0; display: flex; flex-direction: column; height: 100vh; }
  .frame-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
               padding: 10px 18px; background: var(--card); border-bottom: 1px solid var(--border); flex: none; }
  .frame-bar h1 { font-size: 16px; margin: 0; color: var(--navy); font-weight: 700; }
  .frame-bar .note { font-size: 11px; color: var(--muted); }
  .frame-bar a { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .frame-wrap { flex: 1; min-height: 0; position: relative; background: var(--card); }
  .frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .frame-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                   color: var(--muted); font-size: 13px; }
  .linkout { max-width: 560px; margin: 40px auto; background: var(--card); border: 1px solid var(--border);
             border-top: 3px solid var(--teal); border-radius: 8px; padding: 24px; }
  .linkout h2 { margin: 0 0 8px; font-size: 18px; color: var(--navy); }
  .linkout p { font-size: 13px; line-height: 1.5; color: var(--text); }
  .linkout .btn { display: inline-block; margin-top: 8px; background: var(--navy); color: #fff; padding: 9px 16px;
                  border-radius: 6px; font-weight: 600; font-size: 13px; }
  .linkout .btn:hover { background: var(--teal); text-decoration: none; }
  @media (max-width: 760px) {
    .app-main.frame-main { height: calc(100vh - 58px); height: calc(100dvh - 58px); }
    .frame-bar { padding: 8px 12px; }
    .frame-bar .note { display: none; }
  }
</style>
</head>
<body data-page="transfer">
<div class="app-layout">
  <nav class="app-sidebar" id="app-sidebar"></nav>
  <main class="app-main frame-main" id="frame-main">
    <div class="frame-bar">
      <div><h1>Transfer Portal</h1><div class="note">Transfer portal app: portal players evaluated against roster needs.</div></div>
      <a id="open-full" href="#" target="_top">Open full screen &#8599;</a>
    </div>
    <div class="frame-wrap" id="frame-wrap">
      <div class="frame-loading" id="frame-loading">Loading Transfer Portal&hellip;</div>
    </div>
  </main>
</div>
<script src="sidebar.js?v=2.9"></script>
<script>
(function () {
  var APP_PATH = "/transfer-app/";
  var HUB_ORIGIN = "https://uncw-recruiting-app.pages.dev";
  // Where the sibling app lives, so a jump between the two apps (their own
  // header buttons) lands on the matching Matrix page instead of loading
  // the other app inside this frame.
  var SIBLINGS = { "/": "recruiting.html", "/transfer-app/": "transfer.html" };
  var onHub = /(^|\.)uncw-recruiting-app\.pages\.dev$/.test(location.hostname);
  var fullUrl = onHub ? APP_PATH : HUB_ORIGIN + APP_PATH;
  document.getElementById("open-full").href = fullUrl;

  var wrap = document.getElementById("frame-wrap");
  if (!onHub) {
    // GitHub Pages (or a local file) -- a cross-site frame would lose the
    // app's login/browser storage in Safari and newer Chrome, so link out.
    document.getElementById("frame-main").classList.remove("frame-main");
    document.querySelector(".frame-bar").style.display = "none";
    wrap.outerHTML =
      '<div class="linkout"><h2>Transfer Portal</h2>' +
      '<p>Transfer portal app: portal players evaluated against roster needs. It runs on the UNCW coaching hub (Cloudflare), so it opens there, ' +
      'inside this same sidebar.</p>' +
      '<a class="btn" href="' + HUB_ORIGIN + '/matrix/transfer.html">Open Transfer Portal &#8599;</a></div>';
    return;
  }

  var frame = document.createElement("iframe");
  frame.title = "Transfer Portal";
  frame.src = APP_PATH;
  frame.setAttribute("allow", "clipboard-write");
  frame.addEventListener("load", function () {
    var loading = document.getElementById("frame-loading");
    if (loading) loading.remove();
    try {
      var p = frame.contentWindow.location.pathname;
      if (p !== APP_PATH && SIBLINGS[p]) { location.href = SIBLINGS[p]; return; }
      if (p.indexOf("/matrix/") === 0) { location.href = p; return; }
      document.title = (frame.contentDocument.title || "Transfer Portal") + " — UNCW Coaching Hub";
    } catch (e) { /* cross-origin navigation -- leave it */ }
  });
  wrap.appendChild(frame);
})();
</script>
</body>
</html>
