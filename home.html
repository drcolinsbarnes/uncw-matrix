<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home — UNCW Women's Soccer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css?v=3">
<style>
  .snapshot-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; max-width: 760px; margin-bottom: 8px; }
  .snapshot-row .metric .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .snapshot-row .metric .value { font-size: 20px; font-weight: 700; color: var(--navy); }
  .snapshot-row .metric .value.small { font-size: 15px; }

  .home-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .home-row .card { flex: 1; min-width: 260px; }
  .home-row .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.4px; }
  .fixture-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .fixture-line .opp { font-size: 16px; font-weight: 700; color: var(--navy); }
  .fixture-line .date { font-size: 12px; color: var(--muted); }
  .fixture-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .result-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 12px; margin-right: 8px; }
  .result-badge.Win { background: var(--win); color: var(--win-text); }
  .result-badge.Loss { background: var(--loss); color: var(--loss-text); }
  .result-badge.Draw { background: var(--off); color: var(--off-text); }
  .result-score { font-size: 20px; font-weight: 700; color: var(--navy); }

  .leaders-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; max-width: 760px; }
  .leaders-row .card .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .leaders-row .card .nm { font-size: 15px; font-weight: 700; color: var(--navy); }
  .leaders-row .card .val { font-size: 12px; color: var(--muted); }
  .leaders-note { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* Season Record dashboard -- added 2026-09-14, Colin: "let's add the
     season record dashboard to the home page" (Fixtures got its own the
     same week; see site-restructure-plan.md). Same stat-grid/stat-tile
     look ported verbatim from national_rpi_template.html's team-detail
     header / fixtures.html's Season Record section, fixed 6 columns (not
     auto-fit) so the 12 tiles land as a clean 6-over-6 grid with Home
     starting row 2 -- same fix applied to those two other pages the same
     day. Narrower than 760px (this project's established mobile
     breakpoint, see sidebar.css) drops to 3 columns. */
  .stat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin: 4px 0 6px; max-width: 760px; }
  .stat-tile { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; text-align: center; }
  .stat-tile .v { font-size: 16px; font-weight: 700; color: var(--navy); }
  .stat-tile .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 2px; }
  @media (max-width: 760px) {
    .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .form { display: inline-flex; gap: 3px; justify-content: center; }
  .form-circle { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
  .form-w { background: #2e7d32; }
  .form-l { background: #c62828; }
  .form-d { background: #78909c; }
  .pos { color: var(--win-text); }
  .neg { color: var(--loss-text); }
</style>
</head>
<body data-page="home">
<div class="app-layout">
  <nav class="app-sidebar" id="app-sidebar"></nav>
  <main class="app-main">
    <h1 class="page-title">Home</h1>
    <p class="sub" id="home-sub">Loading season snapshot&hellip;</p>

    <div class="snapshot-row" id="snapshot-row"></div>

    <h2 class="section-title">Season Record</h2>
    <p class="note" id="season-stats-note" style="display:none;"></p>
    <div class="stat-grid" id="season-stats"></div>

    <h2 class="section-title">This Week</h2>
    <div class="home-row">
      <div class="card accent-top">
        <h3>Next Fixture</h3>
        <div id="next-fixture-body">&mdash;</div>
      </div>
      <div class="card accent-top">
        <h3>Last Result</h3>
        <div id="last-result-body">&mdash;</div>
      </div>
    </div>

    <!-- South Division Standings -- added 2026-09-15, Colin: "let's also add
         the south division standings to home page." Table markup/JS ported
         from caa.html's renderTable() (including the same Non-Conf column
         added there this round), no SOS column here to match caa.html's own
         South table (SOS only shows on caa.html's Overall table). -->
    <h2 class="section-title">South Division Standings</h2>
    <div class="scroll-wrap"><table class="std" id="south-standings-table"></table></div>

    <h2 class="section-title">Team Leaders</h2>
    <p class="note">A preview of the full Squad leaderboards, coming soon.</p>
    <div class="leaders-row" id="leaders-row"></div>
  </main>
</div>
<script src="sidebar.js?v=3"></script>
<script>
// HOME_SUMMARY_START
const HOME_SUMMARY = {"team": "UNC Wilmington", "logo": "https://uncw.edu/media/images/logos/brand/secondary-athletics-logo-notpad-our.png", "record": "5-0-4", "rpi": {"value": 0.5776, "rank": 67, "gp": 9, "total": 342}, "caaStanding": {"division": "South", "rank": 1, "of": 6, "pts": 0, "record": "0-0-0"}, "caaSouthStandings": [{"name": "UNC Wilmington", "division": "South", "logo": "https://uncw.edu/media/images/logos/brand/secondary-athletics-logo-notpad-our.png", "natName": "UNC Wilmington", "liveRpi": 0.5776, "liveRpiRank": 67, "liveRpiGp": 9, "liveRpiTotal": 342, "nonConfRecord": "5-0-4", "overall": "5-0-4", "overallPct": 0.7777777777777778, "overallW": 5, "liveSos": 160, "form": ["D", "D", "W", "W", "D"], "played": 0, "w": 0, "l": 0, "d": 0, "gf": 0, "ga": 0, "gd": 0, "pts": 0, "rank": 1}, {"name": "Elon", "division": "South", "logo": "https://a.espncdn.com/i/teamlogos/ncaa/500/2210.png", "natName": "Elon", "liveRpi": 0.4406, "liveRpiRank": 233, "liveRpiGp": 8, "liveRpiTotal": 342, "nonConfRecord": "5-1-2", "overall": "5-1-2", "overallPct": 0.75, "overallW": 5, "liveSos": 204, "form": ["D", "W", "W", "D", "W"], "played": 0, "w": 0, "l": 0, "d": 0, "gf": 0, "ga": 0, "gd": 0, "pts": 0, "rank": 2}, {"name": "Campbell", "division": "South", "logo": "https://a.espncdn.com/i/teamlogos/ncaa/500/2097.png", "natName": "Campbell", "liveRpi": 0.4731, "liveRpiRank": 187, "liveRpiGp": 9, "liveRpiTotal": 342, "nonConfRecord": "3-4-2", "overall": "3-4-2", "overallPct": 0.4444444444444444, "overallW": 3, "liveSos": 184, "form": ["W", "L", "W", "D", "L"], "played": 0, "w": 0, "l": 0, "d": 0, "gf": 0, "ga": 0, "gd": 0, "pts": 0, "rank": 3}, {"name": "Charleston", "division": "South", "logo": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/College_of_Charleston_Cougars_logo.svg/120px-College_of_Charleston_Cougars_logo.svg.png", "natName": "College of Charleston", "liveRpi": 0.4894, "liveRpiRank": 162, "liveRpiGp": 9, "liveRpiTotal": 342, "nonConfRecord": "3-4-2", "overall": "3-4-2", "overallPct": 0.4444444444444444, "overallW": 3, "liveSos": 172, "form": ["D", "W", "W", "L", "L"], "played": 0, "w": 0, "l": 0, "d": 0, "gf": 0, "ga": 0, "gd": 0, "pts": 0, "rank": 4}, {"name": "William & Mary", "division": "South", "logo": "https://a.espncdn.com/i/teamlogos/ncaa/500/2729.png", "natName": "William & Mary", "liveRpi": 0.4122, "liveRpiRank": 265, "liveRpiGp": 7, "liveRpiTotal": 342, "nonConfRecord": "1-4-2", "overall": "1-4-2", "overallPct": 0.2857142857142857, "overallW": 1, "liveSos": 173, "form": ["L", "L", "L", "D", "W"], "played": 0, "w": 0, "l": 0, "d": 0, "gf": 0, "ga": 0, "gd": 0, "pts": 0, "rank": 5}, {"name": "Hampton", "division": "South", "logo": "https://a.espncdn.com/i/teamlogos/ncaa/500/2261.png", "natName": "Hampton University", "liveRpi": 0.3461, "liveRpiRank": 324, "liveRpiGp": 7, "liveRpiTotal": 342, "nonConfRecord": "1-5-1", "overall": "1-5-1", "overallPct": 0.21428571428571427, "overallW": 1, "liveSos": 213, "form": ["D", "L", "W", "L", "L"], "played": 0, "w": 0, "l": 0, "d": 0, "gf": 0, "ga": 0, "gd": 0, "pts": 0, "rank": 6}], "nextFixture": {"date": "2026-09-20", "opponent": "Hampton", "venue": "Away", "city": "Hampton, VA", "rpi": 340, "opponentRecord": "1-5-1"}, "lastResult": {"date": "2026-09-13", "opponent": "Coastal Carolina", "result": "Draw", "fullTimeScore": "0-0", "venue": "Home", "hasStats": false}, "leaders": [{"label": "Goal Contributions", "name": "C. Leonard", "value": 5}, {"label": "Defensive Contribution / 90", "name": "R. Fry", "value": 6.15}, {"label": "Distance / 90", "name": "V. Hankova", "value": 14845}], "asOf": "2026-09-06", "seasonStats": {"rank": 67, "rpiTotal": 0.5754, "rpiAdjusted": 0.5776, "record": "5-0-4", "gf": 15, "ga": 6, "gd": 9, "homeRecord": "2-0-3", "awayRecord": "3-0-1", "confRecord": "0-0-0", "nonConfRecord": "5-0-4", "last5": ["D", "D", "W", "W", "D"], "vsTop50": "1-0-0", "vs51_150": "2-0-2"}};
// HOME_SUMMARY_END

// Season Record dashboard helpers -- ported verbatim from
// national_rpi_template.html / fixtures.html's Season Record section so
// the same numbers format identically across all three pages.
function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  let s = v.toFixed(3);
  if (s.startsWith("0.")) s = s.slice(1);
  else if (s.startsWith("-0.")) s = "-" + s.slice(2);
  return s;
}

function fmtGD(v) {
  if (v === null || v === undefined) return "—";
  if (v > 0) return `<span class="pos">+${v}</span>`;
  if (v < 0) return `<span class="neg">${v}</span>`;
  return "0";
}

function renderFormCircles(results) {
  if (!results || !results.length) return "—";
  return `<span class="form">` + results.map(r => {
    const cls = r === "W" ? "form-w" : r === "L" ? "form-l" : "form-d";
    const title = r === "W" ? "Win" : r === "L" ? "Loss" : "Draw";
    return `<span class="form-circle ${cls}" title="${title}">${r}</span>`;
  }).join("") + `</span>`;
}

// South Division Standings table -- ported verbatim from caa.html's
// renderTable() (same column set/order, including the Non-Conf column added
// there the same day) so the two pages stay in lockstep. No showSOS option
// used here, matching caa.html's own South table.
function renderStandingsTable(elId, teams) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!teams || !teams.length) {
    el.outerHTML = '<p class="note">No teams to show.</p>';
    return;
  }
  const liveHdr = '<th class="num" title="National rank by current-season RPI. 1 = best. Early-season ranks are based on very few games.">RPI</th>';
  const nonConfHdr = '<th title="Non-conference record (excludes CAA games).">Non-Conf</th>';
  // Form column -- added 2026-09-15, mirrors the same addition on
  // caa.html's renderTable() (Colin: "add the form at the end of the
  // columns for all those tables/standings"). Reuses this page's own
  // existing renderFormCircles() helper (already defined above for the
  // Season Record dashboard).
  const formHdr = '<th title="Form: last 5 results, oldest to newest.">Form</th>';
  el.innerHTML = `<thead><tr>
      <th class="num">Rk</th><th></th><th>Team</th><th class="num">P</th><th class="num">W</th>
      <th class="num">L</th><th class="num">D</th><th class="num">GF</th><th class="num">GA</th>
      <th class="num">GD</th><th class="num">Pts</th>${liveHdr}${nonConfHdr}<th>Overall</th>${formHdr}
    </tr></thead><tbody></tbody>`;
  const tbody = el.querySelector("tbody");
  teams.forEach(t => {
    const tr = document.createElement("tr");
    if (t.name === "UNC Wilmington") tr.className = "uncw-row";
    const liveCell = t.liveRpiRank != null
      ? `<td class="num" title="RPI ${t.liveRpi != null ? t.liveRpi.toFixed(4) : "?"} — ${t.liveRpiGp} game${t.liveRpiGp === 1 ? "" : "s"} played so far this season -- provisional.">${t.liveRpiRank}</td>`
      : `<td class="num">—</td>`;
    const stHref = `national_rpi.html#/team/${encodeURIComponent(t.natName || t.name)}`;
    const nameCell = `<a class="team-link" href="${stHref}" title="${t.name} — full national schedule &amp; RPI detail">${t.name}</a>`;
    tr.innerHTML = `<td class="num">${t.rank}</td>
      <td>${t.logo ? `<img class="logo" src="${t.logo}" onerror="this.style.visibility='hidden'">` : ""}</td>
      <td>${nameCell}</td><td class="num">${t.played}</td><td class="num">${t.w}</td><td class="num">${t.l}</td>
      <td class="num">${t.d}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td>
      <td class="num">${t.gd > 0 ? "+" : ""}${t.gd}</td>
      <td class="num">${t.pts}</td>${liveCell}<td>${t.nonConfRecord || "—"}</td><td>${t.overall}</td>
      <td>${renderFormCircles(t.form)}</td>`;
    tbody.appendChild(tr);
  });
}

// This whole render is wrapped in try/catch, same isolation practice
// adopted after the 2026-09-12 Match Center outage -- a data problem here
// should degrade to a friendly message, never break the sidebar or the
// rest of the page (which, since sidebar.js is its own separate <script>
// tag, it structurally cannot do anyway -- but the try/catch also keeps
// this page's OWN sections from taking each other down).
try {
  const h = HOME_SUMMARY;
  if (!h || !h.team) {
    document.getElementById("home-sub").textContent = "No season data yet.";
  } else {
    document.getElementById("home-sub").textContent =
      `${h.team} — 2026 season` + (h.asOf ? ` · through ${h.asOf}` : "");

    const snap = document.getElementById("snapshot-row");
    const rpiText = h.rpi && h.rpi.rank != null
      ? `#${h.rpi.rank} <span class="value small">of ${h.rpi.total}</span>`
      : "—";
    const caaText = h.caaStanding
      ? `#${h.caaStanding.rank} <span class="value small">of ${h.caaStanding.of} (${h.caaStanding.division})</span>`
      : "—";
    snap.innerHTML = `
      <div class="card accent-top metric"><div class="label">Overall Record</div><div class="value">${h.record || "—"}</div></div>
      <div class="card accent-top metric"><div class="label">National RPI Rank</div><div class="value">${rpiText}</div></div>
      <div class="card accent-top metric"><div class="label">CAA Standing</div><div class="value">${caaText}</div></div>
    `;

    const S = h.seasonStats;
    const statsGrid = document.getElementById("season-stats");
    const statsNote = document.getElementById("season-stats-note");
    if (!S) {
      statsGrid.innerHTML = "";
      statsNote.style.display = "";
      statsNote.textContent = "No season record data yet.";
    } else {
      statsNote.style.display = "none";
      statsNote.textContent = "";
      // Same tile order/6-over-6 grid as Fixtures' and the National RPI
      // page's Season Record sections. Reorganized 2026-09-15 (Colin):
      // Record/Non-Conf/CAA/Home/Away/Goals F/A/D on row 1, RPI Rank/RPI
      // Total/Adjust Total/vs Top 50/vs 51-150/Form on row 2.
      statsGrid.innerHTML = [
        ["Record", S.record],
        ["Non-Conf", S.nonConfRecord],
        ["CAA", S.confRecord],
        ["Home", S.homeRecord],
        ["Away", S.awayRecord],
        ["Goals F/A/D", `${S.gf}-${S.ga} (${fmtGD(S.gd)})`],
        ["RPI Rank", S.rank != null ? "#" + S.rank : "—"],
        ["RPI Total", fmtPct(S.rpiTotal)],
        ["Adjust Total", fmtPct(S.rpiAdjusted)],
        ["vs Top 50", S.vsTop50],
        ["vs 51-150", S.vs51_150],
        ["Form", renderFormCircles(S.last5)],
      ].map(([label, val]) => `<div class="stat-tile"><div class="v">${val}</div><div class="l">${label}</div></div>`).join("");
    }

    const nf = h.nextFixture;
    document.getElementById("next-fixture-body").innerHTML = nf ? `
      <div class="fixture-line"><span class="opp">vs ${nf.opponent}</span><span class="date">${nf.date}</span></div>
      <div class="fixture-meta">
        ${nf.venue}${nf.city ? " · " + nf.city : ""}<br>
        Opponent RPI: ${nf.rpi != null ? "#" + nf.rpi : "—"} &middot; Opponent record: ${nf.opponentRecord || "—"}
      </div>
    ` : `<p class="note">No upcoming fixture on file.</p>`;

    const lr = h.lastResult;
    document.getElementById("last-result-body").innerHTML = lr ? `
      <div class="fixture-line">
        <span><span class="result-badge ${lr.result}">${lr.result}</span><span class="result-score">${lr.fullTimeScore}</span></span>
        <span class="date">${lr.date}</span>
      </div>
      <div class="fixture-meta">vs ${lr.opponent} &middot; ${lr.venue}
        ${lr.hasStats ? "" : '<br><span style="color:var(--muted);">Match Center detail not yet tagged</span>'}
      </div>
    ` : `<p class="note">No result on file yet.</p>`;

    renderStandingsTable("south-standings-table", h.caaSouthStandings);

    const leaders = document.getElementById("leaders-row");
    if (h.leaders && h.leaders.length) {
      leaders.innerHTML = h.leaders.map(l => `
        <div class="card">
          <div class="lbl">${l.label}</div>
          <div class="nm">${l.name}</div>
          <div class="val">${l.value}</div>
        </div>
      `).join("");
    } else {
      leaders.innerHTML = `<p class="note">No leaderboard data yet.</p>`;
    }
  }
} catch (e) {
  console.error("Home page failed to render:", e);
  document.getElementById("home-sub").textContent = "Couldn't load season data (see browser console).";
}
</script>
</body>
</html>
